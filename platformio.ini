; Plataforma: ESP32 DevKit V1 (30 pines) con modulo WROOM
; Framework: Arduino
; Versiones de librerias FIJAS (regla del proyecto: no cambiar sin decirlo)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Particion sin OTA (app ~3.9 MB) + LittleFS 64 KB para outbox critica.
; NVS queda en el mismo offset (0x9000) que default.csv -> no requiere erase.
board_build.partitions = partitions/no_ota_with_littlefs.csv

lib_ldf_mode = chain+

lib_deps =
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/DHT sensor library@1.4.7
    olikraus/U8g2@2.36.18
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/OneWire@2.3.8
    adafruit/RTClib@2.1.4
    bblanchon/ArduinoJson@7.4.3
    Links2004/WebSockets@2.7.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src

[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts = pre:tools/native_toolchain.py
; Compilar y enlazar el codigo fuente con los tests (el motor rules.cpp vive en src/,
; no en una libreria como en V2). Se excluyen main.cpp y hardware.cpp porque
; requieren el framework Arduino.
test_build_src = true
build_src_filter = +<*> -<main.cpp> -<hardware.cpp>
build_flags =
    -std=c++11
    -Isrc